[project]
name = "zetamaxx-api"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "pydantic>=2",
    "pydantic-settings>=2.16.3",
    "pyjwt[crypto]>=2.15.1",
    "sqlalchemy[asyncio]>=2.0",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
    "time-machine>=3.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 120
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI's Depends() in argument defaults

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
