# Production only. Development runs without Docker: see README ("Run it locally").
#
# Driven by scripts/deploy.sh on the VPS with TAG set to the release image tag.
# Images are built in CI and shipped to the VPS; nothing builds here.
#
# nginx (running in its own container) reaches the web app by name over the
# external nginx-proxy network: proxy_pass http://zetamaxx-web:3000. Nothing
# here publishes a port on the host.
services:
  zetamaxx-api:
    image: zetamaxx-api:${TAG}
    container_name: zetamaxx-api
    restart: unless-stopped
    # CLERK_SECRET_KEY and ALLOWED_ORIGINS. Lives on the VPS only, never in the
    # repo; see .env.example. deploy.sh refuses to run until the file exists.
    env_file:
      - /opt/zetamaxx/.env
    environment:
      DATABASE_PATH: /data/zetamaxx.db
    volumes:
      # The database lives here. Only this container mounts it: SQLite must have one writer.
      - zetamaxx-data:/data
    networks:
      - internal

  zetamaxx-web:
    image: zetamaxx-web:${TAG}
    container_name: zetamaxx-web
    restart: unless-stopped
    # CLERK_SECRET_KEY, for the sign-in checks Next.js does on the server.
    env_file:
      - /opt/zetamaxx/.env
    # /api is forwarded to the api container by a rewrite fixed into the image
    # when it is built (see the Build images step in .github/workflows/deploy.yml).
    depends_on:
      - zetamaxx-api
    networks:
      - internal
      - nginx-proxy

networks:
  internal:
  nginx-proxy:
    external: true

volumes:
  # Survives rebuilds and restarts. Deleting this volume deletes the data.
  zetamaxx-data:
    name: zetamaxx-data
